<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion Admin - Rapports GE</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #000; color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #121212; padding: 40px; border-radius: 12px; border: 1px solid #333; width: 320px; }
        h1 { color: #70bd95; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #70bd95; color: #0f1419; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #5aa87d; }
        .error { color: #ff6b6b; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Admin Rapports GE</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post">
            <input type="text" name="username" placeholder="Utilisateur" required autofocus>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit">Connexion</button>
        </form>
        <p style="font-size: 0.85rem; color: #aaa; margin-top: 20px;">Par défaut : admin / admin123<br>Changez le mot de passe dans app.py</p>
    </div>
</body>
</html>
